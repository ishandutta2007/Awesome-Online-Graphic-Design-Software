<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-1.5deg); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -1000; }
    }
    .pulse-glow-1 {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .pulse-glow-2 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .float-card-1 {
      animation: floatCard1 7s ease-in-out infinite;
    }
    .float-card-2 {
      animation: floatCard2 9s ease-in-out infinite;
    }
    .animated-line {
      stroke-dasharray: 12, 12;
      animation: dashTravel 35s linear infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Nebulas (Background) -->
  <circle cx="220" cy="120" r="180" fill="url(#glowGrad1)" filter="url(#blurGlow)" class="pulse-glow-1" />
  <circle cx="980" cy="280" r="220" fill="url(#glowGrad2)" filter="url(#blurGlow)" class="pulse-glow-2" />
  <circle cx="600" cy="380" r="160" fill="url(#glowGrad1)" filter="url(#blurGlow)" opacity="0.3" />

  <!-- Geometric Grid Canvas -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Background Dynamic Design Elements (Lower Layer) -->
  <g opacity="0.35">
    <!-- Animated Bézier Vector Curves -->
    <path d="M -50,300 C 250,150 450,420 750,220 C 950,90 1150,280 1250,150" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" class="animated-line" />
    <path d="M -50,180 C 300,320 500,80 800,280 C 1000,400 1100,100 1250,250" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" class="animated-line" style="animation-duration: 45s;" />

    <!-- Vector Anchor Nodes & Handles -->
    <circle cx="250" cy="150" r="4" fill="#38bdf8" />
    <line x1="250" y1="150" x2="280" y2="120" stroke="#38bdf8" stroke-width="1" />
    <circle cx="280" cy="120" r="3" fill="#ffffff" />

    <circle cx="750" cy="220" r="4" fill="#c084fc" />
    <line x1="750" y1="220" x2="710" y2="260" stroke="#c084fc" stroke-width="1" />
    <circle cx="710" cy="260" r="3" fill="#ffffff" />
  </g>

  <!-- Floating Ambient Design Cards (Behind Foreground Text) -->
  <g class="float-card-1" opacity="0.45">
    <rect x="70" y="60" width="150" height="100" rx="12" fill="url(#cardGrad1)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="95" cy="85" r="8" fill="#38bdf8" fill-opacity="0.7" />
    <rect x="115" y="81" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <rect x="95" y="105" width="100" height="6" rx="3" fill="#ffffff" fill-opacity="0.1" />
    <rect x="95" y="120" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.1" />
  </g>

  <g class="float-card-2" opacity="0.45">
    <rect x="970" y="70" width="160" height="110" rx="12" fill="url(#cardGrad1)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <rect x="990" y="90" width="40" height="40" rx="8" fill="#818cf8" fill-opacity="0.3" stroke="#818cf8" stroke-opacity="0.5" />
    <path d="M 1000,120 L 1010,105 L 1020,115 L 1030,100" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="1045" y="95" width="65" height="8" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <rect x="1045" y="112" width="45" height="6" rx="3" fill="#ffffff" fill-opacity="0.1" />
    <rect x="990" y="145" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.1" />
  </g>

  <!-- FOREGROUND CONTENT CONTAINER (Highest Z-index, never obscured) -->
  <g filter="url(#shadow)">
    <!-- Top Sleek Category Pill -->
    <g transform="translate(600, 75)">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#0f172a" fill-opacity="0.8" stroke="url(#primaryGrad)" stroke-width="1.5" />
      <circle cx="-135" cy="0" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="4" text-anchor="middle" class="badge-text">⚡ CURATED DESIGN TECH ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title Heading -->
    <text x="600" y="160" text-anchor="middle" class="main-title">
      Awesome Online Graphic Design Software
    </text>

    <!-- Gradient Accent Subtitle Underline -->
    <rect x="420" y="180" width="360" height="3" rx="1.5" fill="url(#primaryGrad)" />

    <!-- Subtitle -->
    <text x="600" y="222" text-anchor="middle" class="sub-title">
      The definitive index of browser-native SaaS suites &amp; open-source canvas engines
    </text>
    <text x="600" y="252" text-anchor="middle" class="sub-title" font-size="16px" fill="#64748b">
      From Canva &amp; Adobe Express alternatives to self-hosted SVG platforms &amp; AI-assisted workflows
    </text>

    <!-- Bottom Feature Pills / Badges -->
    <g transform="translate(600, 325)">
      <!-- Pill 1 -->
      <g transform="translate(-410, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">🎨 Vector &amp; Raster</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-205, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">📐 SVG-Standards</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">🐳 Self-Hostable</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(205, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">🤖 AI Canvas &amp; MCP</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(410, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">🤝 Real-Time Collab</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="0" fill="none" stroke="#ffffff" stroke-opacity="0.1" />
</svg>
